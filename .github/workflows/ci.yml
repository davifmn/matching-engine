name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # no dependencies to cache
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: tests with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage
        if: matrix.go == 'stable'
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz against the reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: go test -run='^$' -fuzz=FuzzAgainstReference -fuzztime=90s ./internal/book
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: internal/book/testdata/fuzz

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: e2e (load, restart, kill -9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: make build
      - run: ./scripts/e2e.sh
        env:
          DURATION: 15s

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - name: benchmarks
        run: go test -run='^$' -bench=. -benchmem -count=6 ./internal/... | tee bench.txt
      - name: summary
        run: |
          {
            echo '### Benchmarks'
            echo '```'
            grep -E '^(goos|goarch|cpu):' bench.txt | sort -u
            go run golang.org/x/perf/cmd/benchstat@latest bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.txt

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t matching-engine:ci .
      - name: smoke test, including a restart that must keep the order
        run: |
          set -euo pipefail
          wait_ready() { for _ in $(seq 30); do curl -fsS localhost:8080/readyz >/dev/null 2>&1 && return; sleep 1; done; docker logs matchd; exit 1; }
          docker run -d --name matchd -p 8080:8080 matching-engine:ci
          wait_ready
          curl -fsS -X POST localhost:8080/v1/instruments/PETR4/orders \
            -d '{"side":"buy","type":"limit","price":"34.00","quantity":"100"}'
          docker stop matchd
          docker start matchd
          wait_ready
          curl -fsS localhost:8080/v1/instruments/PETR4/book | tee book.json
          grep -q '"resting_orders":1' book.json
          docker logs matchd
      - name: scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: matching-engine:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
